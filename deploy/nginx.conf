# nginx in front of `node server.mjs` (replace rewear.ru with your domain; certificates via certbot or the provider panel)
server {
  listen 80;
  server_name rewear.ru www.rewear.ru;
  return 301 https://rewear.ru$request_uri;
}

server {
  listen 443 ssl http2;
  server_name rewear.ru;
  ssl_certificate     /etc/letsencrypt/live/rewear.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rewear.ru/privkey.pem;

  client_max_body_size 40m;            # photos are sent from the admin as data URLs
  gzip on;
  gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
