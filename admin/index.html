<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#efe5cd">
  <title>Админ-панель — REWEAR VINTAGE</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/admin/admin.js" type="module"></script>
</head>
<body class="admin">
  <header class="admin-bar">
    <strong>REWEAR · админ</strong>
    <span class="admin-actions" id="bar-actions" hidden>
      <a class="link" href="/" target="_blank" rel="noopener">Сайт</a>
      <button class="btn ghost" id="logout" type="button">Выйти</button>
    </span>
  </header>

  <main class="admin-main">
    <p class="notice" id="notice" role="status" hidden></p>

    <form class="card login" id="login-form" hidden>
      <h1>Вход</h1>
      <label>Логин<input name="login" autocomplete="username" required maxlength="100"></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
      <button class="btn" type="submit">Войти</button>
    </form>

    <section id="panel" hidden>
      <div class="panel-head">
        <h1>Товары</h1>
        <button class="btn" id="add" type="button">Добавить вещь</button>
      </div>
      <form class="card editor" id="editor" hidden>
        <h2 id="editor-title">Новая вещь</h2>
        <label>Название<input name="title" required maxlength="100"></label>
        <label>Цена, ₽<input name="price" type="number" inputmode="numeric" min="1" step="1" required></label>
        <label>Описание<textarea name="description" rows="4" maxlength="1000"></textarea></label>
        <label>Бренд<input name="brand" maxlength="60" placeholder="Ralph Lauren"></label>
        <div class="pair">
          <label>Эпоха<input name="era" maxlength="40" placeholder="1990-е"></label>
          <label>Происхождение<input name="origin" maxlength="60" placeholder="Япония"></label>
        </div>
        <label>Состояние<input name="condition" maxlength="60" placeholder="Отличное"></label>
        <label>Замеры, см<input name="measures" maxlength="200" placeholder="Плечи 52 · Рукав 62 · Длина 70"></label>
        <label>Фото<input name="photo" type="file" accept="image/*"></label>
        <div class="stage" id="stage" hidden><img class="preview" id="preview" alt="Предпросмотр фото"><span id="stage-pins"></span></div>
        <p class="fine" id="pin-hint" hidden>Нажмите на фото, чтобы поставить точку: деталь, особенность или дефект. Подпишите каждую (до 8). На сайте точки откроются по нажатию.</p>
        <ol class="pin-list" id="pin-list"></ol>
        <div class="row">
          <button class="btn" type="submit" id="save">Сохранить</button>
          <button class="btn ghost" type="button" id="cancel">Отмена</button>
        </div>
      </form>
      <ul class="list" id="list"></ul>
      <p class="fine">После сохранения сайт обновится примерно через минуту: Vercel пересобирает его из репозитория.</p>
    </section>
  </main>
</body>
</html>
