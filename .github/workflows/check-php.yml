name: Check complete PHP site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: find php -name '*.php' -exec php -l {} \;
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: rewear-reg-ru
          path: dist-reg/
          include-hidden-files: true
