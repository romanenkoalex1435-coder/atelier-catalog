# Keeps dist/ (the static storefront for Timeweb App Platform) in step with the catalog:
# any push to main that changes the site or the catalog rebuilds it and commits the result.
name: Build static storefront
on:
  push:
    branches: [main]
    paths-ignore: ['dist/**']
permissions:
  contents: write
concurrency:
  group: build-static
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Commit dist/
        run: |
          git config user.name "romanenkoalex1435-coder"
          git config user.email "290530055+romanenkoalex1435-coder@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then echo "dist/ is up to date"; exit 0; fi
          git commit -m "Rebuild static storefront [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
